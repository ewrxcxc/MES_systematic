<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('库存管理')" /></head>
<body class="gray-bg">
    <div class="container-div"><div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="search-form"><div class="select-list"><ul>
                <li>物料编码：<input type="text" name="materialCode"/></li>
                <li>物料名称：<input type="text" name="materialName"/></li>
                <li>库存类型：<select name="inventoryType">
                    <option value="">所有</option>
                    <option value="RAW_MATERIAL">原材料</option>
                    <option value="SEMI_FINISHED">半成品</option>
                    <option value="FINISHED">成品</option>
                    <option value="CONSUMABLE">低值易耗</option>
                </select></li>
                <li><a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                    <a class="btn btn-default btn-rounded btn-sm" onclick="resetForm()"><i class="fa fa-refresh"></i>&nbsp;重置</a></li>
            </ul></div></form>
        </div>
        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success btn-rounded" onclick="$.operate.addTab()"><i class="fa fa-plus"></i> 入库/出库</a>
            <a class="btn btn-danger btn-rounded multiple disabled" onclick="$.operate.removeAll()"><i class="fa fa-remove"></i> 删除</a>
            <a class="btn btn-default btn-rounded" onclick="$.table.exportExcel()"><i class="fa fa-download"></i> 导出</a>
        </div>
        <div class="col-sm-12 select-table table-striped"><table id="bootstrap-table"></table></div>
    </div></div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "mes/inventory"; var apiPrefix = ctx + "api/mes/inventory";
        $(function() { queryList(); });
        function queryList() {
            $.table.init({
                url: apiPrefix + "/list", createUrl: prefix + "/add",
                removeUrl: apiPrefix + "/delete", exportUrl: apiPrefix + "/export",
                sortName: "createTime", sortOrder: "desc", striped: true, modalName: "库存",
                columns: [
                    { checkbox: true },
                    { field: 'inventoryId', title: 'ID', visible: false },
                    { field: 'inventoryType', title: '库存类型', align: 'center',
                        formatter: function(v) {
                            var m = { 'RAW_MATERIAL':'info','SEMI_FINISHED':'warning','FINISHED':'success','CONSUMABLE':'default' };
                            var t = { 'RAW_MATERIAL':'原材料','SEMI_FINISHED':'半成品','FINISHED':'成品','CONSUMABLE':'低值易耗' };
                            return '<span class="label label-' + (m[v]||'default') + '">' + (t[v]||v) + '</span>';
                        }
                    },
                    { field: 'materialCode', title: '物料编码', sortable: true },
                    { field: 'materialName', title: '物料名称' },
                    { field: 'quantity', title: '库存数量' },
                    { field: 'location', title: '库位' },
                    { field: 'createTime', title: '更新时间', sortable: true },
                    { title: '操作', align: 'center',
                        formatter: function(v, r) {
                            return '<a class="btn btn-danger btn-xs" onclick="$.operate.remove(\'' + r.inventoryId + '\')"><i class="fa fa-remove"></i>删除</a>';
                        }
                    }
                ]
            });
        }
        function resetForm() { $("#search-form")[0].reset(); $.table.search(); }
    </script>
</body>
</html>
