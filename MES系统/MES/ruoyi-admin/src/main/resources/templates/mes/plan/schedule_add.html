<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('工单排程')" /></head>
<body class="gray-bg">
    <div class="container-div"><div class="row"><div class="col-sm-12">
        <form id="edit-form" class="form-horizontal" style="padding:0;">
            <input type="hidden" name="scheduleId" id="scheduleId"/>
            <input type="hidden" name="productId" id="productId"/>
            <div class="form-card">
                <div class="form-card-header">基础信息</div>
                <div class="form-card-body">
            <div class="form-group">
                <label class="col-sm-2 control-label">排程编号：</label>
                <div class="col-sm-4"><input type="text" name="scheduleNo" class="form-control" placeholder="自动生成（SCH-yyyyMMdd-xxx）" readonly/></div>
                <label class="col-sm-2 control-label">工单：</label>
                <div class="col-sm-4"><select name="workOrderId" id="workOrderId" class="form-control"><option value="">请选择工单</option></select></div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">产品：</label>
                <div class="col-sm-4"><input type="text" name="productName" id="productName" class="form-control" readonly placeholder="选择工单后自动显示"/></div>
                <label class="col-sm-2 control-label">优先级：</label>
                <div class="col-sm-4"><select name="priority" class="form-control">
                    <option value="1">1 - 紧急</option>
                    <option value="2">2 - 高</option>
                    <option value="3" selected>3 - 普通</option>
                    <option value="4">4 - 低</option>
                    <option value="5">5 - 最低</option>
                </select></div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">计划开始：</label>
                <div class="col-sm-4">
                    <input type="text" name="plannedStart" id="plannedStart" class="form-control time-input" data-type="datetime" data-format="yyyy-MM-dd HH:mm:ss" autocomplete="off" placeholder="请选择计划开始时间"/>
                </div>
                <label class="col-sm-2 control-label">计划结束：</label>
                <div class="col-sm-4">
                    <input type="text" name="plannedEnd" id="plannedEnd" class="form-control time-input" data-type="datetime" data-format="yyyy-MM-dd HH:mm:ss" autocomplete="off" placeholder="请选择计划结束时间"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">状态：</label>
                <div class="col-sm-4"><select name="status" class="form-control">
                    <option value="PENDING" selected>待排程</option>
                    <option value="RUNNING">进行中</option>
                    <option value="FINISHED">已完成</option>
                    <option value="CANCELLED">已取消</option>
                </select></div>
                <label class="col-sm-2 control-label"></label>
                <div class="col-sm-4"></div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">备注：</label>
                <div class="col-sm-10"><textarea name="remark" class="form-control" rows="3"></textarea></div>
            </div>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i> 确认保存</button>
                    <button type="button" class="btn btn-default" onclick="resetForm()"><i class="fa fa-refresh"></i> 重置</button>
                    <button type="button" class="btn btn-default" onclick="$.modal.close()"><i class="fa fa-close"></i> 取消返回</button>
                </div>
        </form>
    </div></div></div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "mes/schedule"; var apiPrefix = ctx + "api/mes/schedule";
        var scheduleId = [[${scheduleId}]];

        $(function() {
            // 加载工单下拉框
            $.post(ctx + "api/mes/workorder/list", {pageSize: 999}, function(res) {
                if (res.code == 0) $(res.rows).each(function(i, p) {
                    var productIdAttr = p.productId ? ' data-product-id="' + p.productId + '"' : '';
                    var productAttr = p.productName ? ' data-product="' + p.productName + '"' : '';
                    $("#workOrderId").append('<option value="' + p.workOrderId + '"' + productIdAttr + productAttr + '>' + p.workOrderNo + '</option>');
                });
            });

            // 工单变更时自动显示产品名称和产品ID
            $("#workOrderId").on("change", function() {
                var sel = $(this).find("option:selected");
                $("#productId").val(sel.attr("data-product-id") || '');
                $("#productName").val(sel.attr("data-product") || '');
            });

            if (scheduleId) loadData();
        });

        function loadData() {
            $.get(apiPrefix + "/" + scheduleId, function(res) {
                if (res.code == 0) {
                    $.each(res.data, function(k, v) {
                        if (k === 'plannedStart' || k === 'plannedEnd') {
                            if (v) $("#edit-form [name='" + k + "']").val(v);
                        } else {
                            $("#edit-form [name='" + k + "']").val(v);
                        }
                    });
                    // 编辑时触发工单change以显示产品名称
                    if (res.data.workOrderId) {
                        $("#workOrderId").val(res.data.workOrderId).trigger("change");
                    }
                }
            });
        }

        function submitHandler() {
            var plannedStart = $("#plannedStart").val();
            var plannedEnd = $("#plannedEnd").val();
            if (!plannedStart) { $.modal.alertWarning("请选择计划开始时间喵~"); return; }
            if (!plannedEnd) { $.modal.alertWarning("请选择计划结束时间喵~"); return; }
            if (plannedEnd < plannedStart) { $.modal.alertWarning("计划结束时间不能早于计划开始时间喵~"); return; }

            var data = {}; $("#edit-form").serializeArray().forEach(function(i) { data[i.name] = i.value; });
            if (!data.workOrderId || data.workOrderId == '') { $.modal.msgWarning("请选择工单喵~"); return; }

            if (scheduleId) { data.scheduleId = scheduleId; $.operate.save(apiPrefix + "/update", data); }
            else { $.operate.save(apiPrefix + "/create", data); }
        }
        function resetForm() { $("#edit-form")[0].reset(); }
    </script>
</body>
</html>
