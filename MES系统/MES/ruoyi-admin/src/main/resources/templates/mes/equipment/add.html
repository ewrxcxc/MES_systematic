<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('设备管理')" /></head>
<body class="gray-bg">
    <div class="container-div"><div class="row"><div class="col-sm-12">
        <form id="edit-form" class="form-horizontal" style="padding:0;">
            <input type="hidden" name="equipmentId" id="id"/>
            <div class="form-card">
                <div class="form-card-header">基础信息</div>
                <div class="form-card-body">
            <div class="form-group">
                <label class="col-sm-2 control-label">设备编码：</label>
                <div class="col-sm-4"><input type="text" name="equipmentCode" id="equipmentCode" class="form-control" readonly required/></div>
                <label class="col-sm-2 control-label">设备名称：</label>
                <div class="col-sm-4"><input type="text" name="equipmentName" class="form-control" required/></div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">状态：</label>
                <div class="col-sm-4"><select name="status" id="statusSelect" class="form-control">
                    <option value="IDLE">空闲</option>
                    <option value="RUNNING">运行中</option>
                    <option value="MAINTENANCE">维修中</option>
                    <option value="OFFLINE">离线</option>
                </select></div>
                <label class="col-sm-2 control-label">运行时长(h)：</label>
                <div class="col-sm-4"><input type="number" name="runtimeHours" class="form-control" value="0"/></div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">上次保养：</label>
                <div class="col-sm-4"><input type="date" name="lastMaintenance" class="form-control"/></div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">备注：</label>
                <div class="col-sm-10"><textarea name="remark" class="form-control" rows="3"></textarea></div>
            </div>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i> 确认保存</button>
                    <button type="button" class="btn btn-default" onclick="resetForm()"><i class="fa fa-refresh"></i> 重置</button>
                    <button type="button" class="btn btn-default" onclick="$.modal.close()"><i class="fa fa-close"></i> 取消返回</button>
                </div>
        </form>
    </div></div></div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "mes/equipment"; var apiPrefix = ctx + "api/mes/equipment";
        var id = [[${id}]];

        function generateCode() {
            var now = new Date();
            var y = now.getFullYear();
            var m = ('0' + (now.getMonth() + 1)).slice(-2);
            var d = ('0' + now.getDate()).slice(-2);
            var seq = ('0000' + Math.floor(Math.random() * 10000)).slice(-4);
            return 'EQ' + y + m + d + seq;
        }

        $(function() {
            if (!id) {
                $('#equipmentCode').val(generateCode());
            }
            if (id) loadData();
        });

        function loadData() {
            $.get(apiPrefix + "/" + id, function(res) {
                if (res.code == 0) $.each(res.data, function(k, v) { $("#edit-form [name='" + k + "']").val(v); });
            });
        }

        function submitHandler() {
            var data = {}; $("#edit-form").serializeArray().forEach(function(i) { data[i.name] = i.value; });
            if (!data.equipmentName || $.trim(data.equipmentName) == '') { $.modal.msgWarning("请输入设备名称"); return; }
            if (!data.status || data.status == '') { $.modal.msgWarning("请选择设备状态"); return; }
            if (data.runtimeHours !== '' && (isNaN(data.runtimeHours) || parseFloat(data.runtimeHours) < 0)) { $.modal.msgWarning("运行时长不能为负数"); return; }
            if (id) { data.equipmentId = id; $.operate.save(apiPrefix + "/update", data); }
            else { $.operate.save(apiPrefix + "/create", data); }
        }
        function resetForm() {
            $("#edit-form")[0].reset();
            if (id) { $("#id").val(id); }
        }
    </script>
</body>
</html>
