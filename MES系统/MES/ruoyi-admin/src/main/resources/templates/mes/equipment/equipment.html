<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('设备管理')" /></head>
<body class="gray-bg">
    <div class="container-div"><div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="search-form"><div class="select-list"><ul>
                <li>设备编码：<input type="text" name="equipmentCode"/></li>
                <li>设备名称：<input type="text" name="equipmentName"/></li>
                <li>状态：<select name="status">
                    <option value="">所有</option>
                    <option value="RUNNING">运行中</option>
                    <option value="IDLE">空闲</option>
                    <option value="MAINTENANCE">维修中</option>
                    <option value="OFFLINE">离线</option>
                </select></li>
                <li><a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                    <a class="btn btn-default btn-rounded btn-sm" onclick="resetForm()"><i class="fa fa-refresh"></i>&nbsp;重置</a></li>
            </ul></div></form>
        </div>
        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success btn-rounded" onclick="$.operate.addTab()"><i class="fa fa-plus"></i> 新增</a>
            <a class="btn btn-primary btn-rounded single disabled" onclick="$.operate.editTab()"><i class="fa fa-edit"></i> 修改</a>
            <a class="btn btn-danger btn-rounded multiple disabled" onclick="$.operate.removeAll()"><i class="fa fa-remove"></i> 删除</a>
        </div>
        <div class="col-sm-12 select-table table-striped"><table id="bootstrap-table"></table></div>
    </div></div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "mes/equipment"; var apiPrefix = ctx + "api/mes/equipment";
        $(function() { queryList(); });
        function queryList() {
            $.table.init({
                url: apiPrefix + "/list", createUrl: prefix + "/add", updateUrl: prefix + "/edit/{id}",
                removeUrl: apiPrefix + "/delete", sortName: "createTime", sortOrder: "desc", striped: true, modalName: "设备",
                columns: [
                    { checkbox: true },
                    { field: 'equipmentId', title: 'ID', visible: false },
                    { field: 'equipmentCode', title: '设备编码', sortable: true },
                    { field: 'equipmentName', title: '设备名称', sortable: true,
                        formatter: function(v, r) { return '<a onclick="$.operate.editTab(\'' + r.equipmentId + '\')">' + v + '</a>'; }
                    },
                    { field: 'status', title: '状态', align: 'center',
                        formatter: function(v) {
                            var m = { 'RUNNING':'success','IDLE':'info','MAINTENANCE':'warning','OFFLINE':'danger' };
                            var t = { 'RUNNING':'运行中','IDLE':'空闲','MAINTENANCE':'维修中','OFFLINE':'离线' };
                            return '<span class="label label-' + (m[v]||'default') + '">' + (t[v]||v) + '</span>';
                        }
                    },
                    { field: 'runtimeHours', title: '运行时长(h)' },
                    { field: 'lastMaintenance', title: '上次保养' },
                    { field: 'createTime', title: '创建时间', sortable: true },
                    { title: '操作', align: 'center',
                        formatter: function(v, r) {
                            return '<a class="btn btn-primary btn-xs" onclick="$.operate.editTab(\'' + r.equipmentId + '\')"><i class="fa fa-edit"></i>编辑</a> '
                                + '<a class="btn btn-danger btn-xs" onclick="$.operate.remove(\'' + r.equipmentId + '\')"><i class="fa fa-remove"></i>删除</a>';
                        }
                    }
                ]
            });
        }
        function resetForm() { $("#search-form")[0].reset(); $.table.search(); }
    </script>
</body>
</html>
