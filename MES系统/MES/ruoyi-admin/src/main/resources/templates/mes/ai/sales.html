<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('AI分析')" />
    <style>
        .search-collapse { background: #fff; border-radius: 6px; padding: 14px 18px 6px; border: 1px solid #e8eaed; margin-bottom: 12px; }
        .search-collapse .select-list ul { margin-bottom: 0; }
        .search-collapse .select-list ul li { margin-bottom: 8px; vertical-align: middle; }
        .result-panel {
            background: #fff; border-radius: 6px; padding: 20px 24px; border: 1px solid #e8eaed;
            min-height: 400px; max-height: 70vh; overflow-y: auto;
            font-size: 14px; line-height: 1.8; color: #2c3e50;
        }
        .result-panel h2 { font-size: 20px; margin: 12px 0 8px; color: #1a1a1a; }
        .result-panel h3 { font-size: 17px; margin: 10px 0 6px; color: #333; }
        .result-panel h4 { font-size: 15px; margin: 8px 0 4px; }
        .result-panel table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .result-panel th, .result-panel td { border: 1px solid #dcdfe6; padding: 6px 10px; text-align: left; }
        .result-panel th { background: #f5f7fa; font-weight: 600; }
        .result-panel pre { background: #f5f7fa; padding: 12px 16px; border-radius: 4px; overflow-x: auto; }
        .result-panel strong { color: #e74c3c; }
        .loading-state { display: flex; align-items: center; justify-content: center; height: 400px; color: #909399; }
        .spinner {
            display: inline-block; width: 32px; height: 32px; border: 3px solid #e8eaed;
            border-top-color: #409EFF; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { display: flex; align-items: center; justify-content: center; height: 400px; color: #909399; font-size: 15px; }
    </style>
</head>
<body class="gray-bg">
<div class="container-div">

    <div class="search-collapse">
        <form id="search-form"><div class="select-list"><ul>
            <li>
                <label>销售订单：</label>
                <select name="orderNo" id="searchOrderNo" style="width:240px;">
                    <option value="">-- 请选择订单 --</option>
                </select>
            </li>
            <li>
                <a class="btn btn-primary btn-rounded btn-sm" onclick="MES_AI_SALES.analyze()">
                    <i class="fa fa-magic"></i>&nbsp;开始AI分析
                </a>
            </li>
        </ul></div></form>
    </div>

    <div class="result-panel" id="resultPanel" style="display:none;"></div>
    <div class="loading-state" id="loadingPanel" style="display:none;">
        <span class="spinner"></span> AI正在分析中，请耐心等待...
    </div>
    <div class="empty-state" id="emptyPanel">
        <i class="fa fa-lightbulb-o" style="margin-right:8px;font-size:18px;"></i> 请选择销售订单并点击「开始AI分析」
    </div>

</div>

<th:block th:include="include :: footer" />
<script th:src="@{/mes/js/ai-sales.js}"></script>
</body>
</html>
