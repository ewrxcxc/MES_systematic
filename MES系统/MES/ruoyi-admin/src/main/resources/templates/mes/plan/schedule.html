<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('工单排程')" /></head>
<body class="gray-bg">
    <div class="container-div"><div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="search-form"><div class="select-list"><ul>
                <li>排程编号：<input type="text" name="scheduleNo"/></li>
                <li>工单：<input type="text" name="workOrderNo"/></li>
                <li>状态：<select name="status">
                    <option value="">全部</option>
                    <option value="PENDING">待排程</option>
                    <option value="RUNNING">进行中</option>
                    <option value="FINISHED">已完成</option>
                    <option value="CANCELLED">已取消</option>
                </select></li>
                <li><a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                    <a class="btn btn-default btn-rounded btn-sm" onclick="resetForm()"><i class="fa fa-refresh"></i>&nbsp;重置</a></li>
            </ul></div></form>
        </div>
        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success btn-rounded" onclick="$.operate.addTab()"><i class="fa fa-plus"></i> 新增排程</a>
            <a class="btn btn-primary btn-rounded single disabled" onclick="$.operate.editTab()"><i class="fa fa-edit"></i> 修改</a>
            <a class="btn btn-danger btn-rounded multiple disabled" onclick="$.operate.removeAll()"><i class="fa fa-remove"></i> 删除</a>
        </div>
        <div class="col-sm-12 select-table table-striped"><table id="bootstrap-table"></table></div>
    </div></div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "mes/schedule"; var apiPrefix = ctx + "api/mes/schedule";
        $(function() {
            $.table.init({
                url: apiPrefix + "/list", createUrl: prefix + "/add", updateUrl: prefix + "/edit/{id}",
                removeUrl: apiPrefix + "/delete", exportUrl: apiPrefix + "/export",
                sortName: "createTime", sortOrder: "desc", striped: true, modalName: "工单排程", uniqueId: "scheduleId",
                showExport: false,
                columns: [
                    { checkbox: true },
                    { field: 'scheduleId', title: 'ID', visible: false },
                    { field: 'scheduleNo', title: '排程编号', sortable: true },
                    { field: 'workOrderNo', title: '工单' },
                    { field: 'productName', title: '产品' },
                    { field: 'plannedStart', title: '开始时间', sortable: true },
                    { field: 'plannedEnd', title: '结束时间' },
                    { field: 'priority', title: '优先级', align: 'center',
                        formatter: function(v) {
                            var m = {1:'紧急', 2:'高', 3:'普通', 4:'低', 5:'最低'};
                            var c = {1:'danger', 2:'warning', 3:'primary', 4:'success', 5:'default'};
                            return '<span class="label label-' + (c[v] || 'default') + '">' + (m[v] || v) + '</span>';
                        }
                    },
                    { field: 'status', title: '状态', align: 'center',
                        formatter: function(v) {
                            var m = {'PENDING':'待排程', 'RUNNING':'进行中', 'FINISHED':'已完成', 'CANCELLED':'已取消'};
                            var c = {'PENDING':'warning', 'RUNNING':'success', 'FINISHED':'info', 'CANCELLED':'danger'};
                            return '<span class="label label-' + (c[v] || 'default') + '">' + (m[v] || v) + '</span>';
                        }
                    },
                    { field: 'createTime', title: '创建时间', sortable: true },
                    { title: '操作', align: 'center',
                        formatter: function(v, r, i) {
                            var btns = '';
                            btns += '<a class="btn btn-primary btn-xs" onclick="$.operate.editTab(\'' + r.scheduleId + '\')"><i class="fa fa-edit"></i> 编辑</a> ';
                            btns += '<a class="btn btn-danger btn-xs" onclick="$.operate.remove(\'' + r.scheduleId + '\')"><i class="fa fa-remove"></i> 删除</a>';
                            return btns;
                        }
                    }
                ]
            });
        });
        function resetForm() { $("#search-form")[0].reset(); $.table.search(); }
    </script>
</body>
</html>
