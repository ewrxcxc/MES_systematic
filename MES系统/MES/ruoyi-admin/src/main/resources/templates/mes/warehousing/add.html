<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('新增入库')" /></head>
<body class="gray-bg">
    <div class="container-div"><div class="row"><div class="col-sm-12">
        <form id="edit-form" class="form-horizontal" style="padding:0;">
            <div class="form-card">
                <div class="form-card-header">基础信息</div>
                <div class="form-card-body">
            <div class="form-group">
                <label class="col-sm-2 control-label">入库单号：</label>
                <div class="col-sm-4"><input type="text" name="warehousingNo" class="form-control" placeholder="自动生成"/></div>
                <label class="col-sm-2 control-label">入库类型：</label>
                <div class="col-sm-4"><select name="warehousingType" class="form-control">
                    <option value="FINISHED">成品入库</option>
                    <option value="SEMI">半成品入库</option>
                </select></div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">工单：</label>
                <div class="col-sm-4"><select name="workOrderId" id="workOrderSelect" class="form-control" required>
                    <option value="">请选择工单</option>
                </select></div>
                <label class="col-sm-2 control-label">库位：</label>
                <div class="col-sm-4"><input type="text" name="location" class="form-control" placeholder="成品仓-A区"/></div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">备注：</label>
                <div class="col-sm-10"><textarea name="remark" class="form-control" rows="3"></textarea></div>
            </div>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i> 确认保存</button>
                    <button type="button" class="btn btn-default" onclick="resetForm()"><i class="fa fa-refresh"></i> 重置</button>
                    <button type="button" class="btn btn-default" onclick="$.modal.close()"><i class="fa fa-close"></i> 取消返回</button>
                </div>
        </form>
    </div></div></div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "mes/warehousing"; var apiPrefix = ctx + "api/mes/warehousing";
        $(function() {
            // 先获取质检通过的工单ID列表，再加载工单并筛选
            $.get(ctx + "api/mes/quality/passedWorkOrders", function(passRes) {
                var passedIds = passRes.code == 0 && passRes.data ? passRes.data : [];
                $.post(ctx + "api/mes/workorder/list", {pageSize: 999}, function(res) {
                    if (res.code == 0) $(res.rows).each(function(i, p) {
                        var statusText = {'WAITING':'等待','READY':'就绪','RUNNING':'运行中','FINISHED':'已完成'};
                        if ((p.status == 'FINISHED' || p.status == 'RUNNING') && passedIds.indexOf(p.workOrderId) >= 0) {
                            $("#workOrderSelect").append('<option value="' + p.workOrderId + '">' + p.workOrderNo + ' [' + (statusText[p.status]||p.status) + ']</option>');
                        }
                    });
                });
            });
        });
        function submitHandler() {
            var data = {}; $("#edit-form").serializeArray().forEach(function(i) { data[i.name] = i.value; });
            if (!data.workOrderId || data.workOrderId == '') { $.modal.msgWarning("请选择工单"); return; }
            if (!data.warehousingType || data.warehousingType == '') { $.modal.msgWarning("请选择入库类型"); return; }
            $.operate.save(apiPrefix + "/create", data);
        }
        function resetForm() { $("#edit-form")[0].reset(); }
    </script>
</body>
</html>
